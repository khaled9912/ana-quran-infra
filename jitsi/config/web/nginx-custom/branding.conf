# Rebrand the HTML the room URL serves so link previews (WhatsApp, Telegram,
# Slack, …) describe the lesson instead of Jitsi. The room itself is untouched:
# sub_filter only rewrites text/html responses, i.e. index.html.
#
# Loaded by meet.conf via: include /run/web/config/nginx-custom/*.conf;

sub_filter_once off;

sub_filter '<title>Jitsi Meet</title>' '<title>Ana Quran lesson room</title>';
sub_filter '<meta property="og:title" content="Jitsi Meet"/>' '<meta property="og:title" content="Ana Quran lesson room"/>';
sub_filter '<meta property="og:description" content="Join a WebRTC video conference powered by the Jitsi Videobridge"/>' '<meta property="og:description" content="Join a live Quran lesson with your teacher on Ana Quran."/>';
sub_filter '<meta property="og:image" content="images/jitsilogo.png?v=1"/>' '<meta property="og:image" content="https://$host/branding/ana-quran.png"/>';
sub_filter '<meta name="theme-color" content="#2A3A4B">' '<meta name="theme-color" content="#217a34">';
sub_filter '<link rel="icon" href="images/favicon.svg?v=1">' '<link rel="icon" href="/branding/ana-quran.png">';

# Branding assets live in the config overlay, which the web entrypoint copies
# to /run/web/config at boot. The whole folder is served because the dynamic
# branding JSON points at the virtual background image next to it.
location /branding/ {
    alias /run/web/config/branding/;
    add_header Cache-Control "public, max-age=86400";
}
