<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">Ana Quran lesson background</title>
  <desc id="desc">The academy's deep green frame with no mark in it: the room overlay carries the logo, so nothing competes with the speaker.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a26" />
      <stop offset="0.55" stop-color="#133630" />
      <stop offset="1" stop-color="#173b35" />
    </linearGradient>
    <radialGradient id="glow" cx="13%" cy="50%" r="42%">
      <stop offset="0" stop-color="#a7773e" stop-opacity="0.18" />
      <stop offset="1" stop-color="#a7773e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#glow)" />
  <rect width="1280" height="720" fill="url(#vignette)" />
</svg>
