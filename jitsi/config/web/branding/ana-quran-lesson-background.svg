<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title">
  <title id="title">Ana Quran lesson background</title>
  <desc id="desc">A deep green background with the Ana Quran logo kept small on the left so the speaker stays the focus of the frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2a26" />
      <stop offset="0.55" stop-color="#133630" />
      <stop offset="1" stop-color="#173b35" />
    </linearGradient>
    <radialGradient id="glow" cx="13%" cy="50%" r="42%">
      <stop offset="0" stop-color="#a7773e" stop-opacity="0.18" />
      <stop offset="1" stop-color="#a7773e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.28" />
    </linearGradient>
    <style>
      .arch { fill: none; stroke: #ffffff; stroke-width: 4.2; stroke-linejoin: round; stroke-linecap: round; }
      .stack { fill: none; stroke: rgba(255,255,255,0.5); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
      .page { fill: rgba(255,255,255,0.22); stroke: #ffffff; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
      .spine { fill: none; stroke: rgba(255,255,255,0.85); stroke-width: 1.8; stroke-linecap: round; }
      .ar { font-family: "Geeza Pro", "Al Nile", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif; font-size: 38px; font-weight: 700; fill: #ffffff; }
      .en { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 23px; font-weight: 700; letter-spacing: 0.4px; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)" />
  <rect width="1280" height="720" fill="url(#glow)" />
  <rect width="1280" height="720" fill="url(#vignette)" />

  <svg x="56" y="260" width="142" height="200" viewBox="18 22 242 340" preserveAspectRatio="xMidYMid meet">
    <path class="arch" d="M 26.5 354 L 26.5 200 C 27 186 31 170 39 158 C 47 146 58 138 64 124 C 68 114 68 104 70 96 C 82 78 140 48 139.5 30 C 139 48 198 78 209 96 C 211 104 211 114 215 124 C 221 138 232 146 240 158 C 248 170 252 186 252.5 200 L 252.5 354 Z" />
    <path class="arch" d="M 36 344 L 36 196 C 37 182 41 168 47 158 C 55 146 66 138 72 126 C 76 116 77 106 79 98 C 84 82 141 60 139.5 44 C 138 60 195 82 200 98 C 202 106 203 116 207 126 C 213 138 224 146 232 158 C 238 168 242 182 243 196 L 243 344 Z" />

    <g>
      <path class="stack" transform="translate(-11,7)" d="M 139.5 164 C 118 165 84 168 66 176 C 61 177.5 58 181 58 186 L 58 266 C 58 276 54 282 48 285 C 78 291 112 295 139.5 292" />
      <path class="stack" transform="translate(-7,4.5)" d="M 139.5 164 C 118 165 84 168 66 176 C 61 177.5 58 181 58 186 L 58 266 C 58 276 54 282 48 285 C 78 291 112 295 139.5 292" />
      <path class="stack" transform="translate(-3.5,2.5)" d="M 139.5 164 C 118 165 84 168 66 176 C 61 177.5 58 181 58 186 L 58 266 C 58 276 54 282 48 285 C 78 291 112 295 139.5 292" />
      <path class="stack" transform="translate(11,7)" d="M 139.5 164 C 161 165 195 168 213 176 C 218 177.5 221 181 221 186 L 221 266 C 221 276 225 282 231 285 C 201 291 167 295 139.5 292" />
      <path class="stack" transform="translate(7,4.5)" d="M 139.5 164 C 161 165 195 168 213 176 C 218 177.5 221 181 221 186 L 221 266 C 221 276 225 282 231 285 C 201 291 167 295 139.5 292" />
      <path class="stack" transform="translate(3.5,2.5)" d="M 139.5 164 C 161 165 195 168 213 176 C 218 177.5 221 181 221 186 L 221 266 C 221 276 225 282 231 285 C 201 291 167 295 139.5 292" />

      <path class="page" d="M 139.5 164 C 118 165 84 168 66 176 C 61 177.5 58 181 58 186 L 58 266 C 58 276 54 282 48 285 C 78 291 112 295 139.5 292 Z" />
      <path class="page" d="M 139.5 164 C 161 165 195 168 213 176 C 218 177.5 221 181 221 186 L 221 266 C 221 276 225 282 231 285 C 201 291 167 295 139.5 292 Z" />
      <path class="spine" d="M 139.5 171 L 139.5 290" />
    </g>

    <text class="ar" x="104" y="229" text-anchor="middle" direction="rtl" lang="ar">قرآن</text>
    <text class="ar" x="183" y="229" text-anchor="middle" direction="rtl" lang="ar">أنا</text>
    <text class="en" x="99" y="259" text-anchor="middle">Anaa</text>
    <text class="en" x="184" y="259" text-anchor="middle">Quran</text>
  </svg>
</svg>
